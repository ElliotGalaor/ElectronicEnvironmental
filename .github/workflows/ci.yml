name: CI

# Lint and tests, then the Docker image, built once and smoke-tested.
# - Pull requests: the image is built and tested, not published.
# - main and v* tags: that same image is pushed to GitHub Container Registry, tagged
#   sha-<commit> (always), latest (main) and the version number (tags).
#   On main, the CD workflow then deploys it (docs/DEPLOY.md); a v* tag gets a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only pull request runs are cancelled: every commit of main keeps its own image (rollbacks)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint (ruff, actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Workflows (actionlint)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest --junitxml=pytest-report.xml
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: pytest-report.xml

  image:
    name: Docker image
    needs: [lint, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # sha-<7 characters of the commit>: the CD workflow derives the same tag from the commit
      DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Built once and loaded into the runner's Docker: the image tested below is the one pushed
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            rohs-checker:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test
        run: |
          docker run -d --name app -p 8000:8000 rohs-checker:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/stats > stats.json; then break; fi
            sleep 1
          done
          cat stats.json
          python3 -c "import json; d = json.load(open('stats.json')); assert d['total'] > 100, d; print('components in database:', d['total'])"
          curl -fsS http://127.0.0.1:8000/ | grep -q "RoHS / REACH Checker"
          curl -fsS -o example.csv http://127.0.0.1:8000/examples/bom_example.csv && head -1 example.csv   # home page example

      - name: Container logs
        if: always()
        run: docker logs app || true

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### Image pushed to GHCR" >> "$GITHUB_STEP_SUMMARY"
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
            echo "- \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$TAGS"

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The image the image job built and pushed for this tag
          release_ref="${IMAGE,,}:${GITHUB_REF_NAME#v}"
          fence="\`\`\`"
          printf '## Docker image\n\n%sbash\ndocker run -p 8000:8000 -v rohs-data:/data %s\n%s\n' "$fence" "$release_ref" "$fence" > notes.md
          # The generated notes (PRs merged since the previous version) are appended after this text
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
