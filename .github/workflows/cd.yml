name: CD

# Construit l'image Docker à chaque pull request (vérification) et la publie sur
# GitHub Container Registry à chaque merge sur main et à chaque tag v*.
# Un tag v* crée aussi une release GitHub avec les notes de version.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  tests:
    name: Tests avant publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  image:
    name: Image Docker
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr

      - name: Construction (chargée localement pour le test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: electronic-environmental:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de fumée du conteneur
        run: |
          docker run -d --name app -p 8000:8000 electronic-environmental:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/stats > stats.json; then break; fi
            sleep 1
          done
          cat stats.json
          python3 -c "import json; d = json.load(open('stats.json')); assert d['total'] > 100, d; print('composants en base :', d['total'])"
          curl -fsS http://127.0.0.1:8000/ | grep -q "Vérificateur RoHS"
          docker logs app

      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    name: Release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Créer la release avec les notes générées
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="${IMAGE,,}:${GITHUB_REF_NAME#v}"
          fence='```'
          printf '## Image Docker\n\n%sbash\ndocker run -p 8000:8000 -v rohs-data:/data %s\n%s\n' "$fence" "$image" "$fence" > notes.md
          # Les notes générées (PR fusionnées depuis la version précédente) sont ajoutées après ce texte
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
