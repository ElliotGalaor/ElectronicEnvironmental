name: CD

# Deploys an image the CI workflow already built, tested and pushed: no rebuild, no tests.
# The same image (pinned by digest) goes to staging first, automatically, then to production
# once the reviewer of the production environment approves. See docs/DEPLOY.md.
# - Automatic: after every successful CI run on main, the image of that commit (sha-<commit>).
# - By hand (Actions > CD > Run workflow): any image tag, to redeploy or roll back.
run-name: Deploy ${{ inputs.tag || github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy: sha-<commit> (e.g. sha-6ca3777) or a version (e.g. 2.0.0)"
        required: true
        type: string

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Image to deploy
    # Only successful CI runs of a push to main (a pull request from a branch named main
    # also triggers workflow_run, and its image is never published)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the tag to the image digest
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          else
            tag="sha-${HEAD_SHA:0:7}"   # tag pushed by the CI run that triggered this one
          fi
          if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag: $tag"
            exit 1
          fi
          repo="${IMAGE,,}"
          # Staging and production both get exactly this digest
          if ! digest=$(docker buildx imagetools inspect "$repo:$tag" --format '{{.Manifest.Digest}}'); then
            echo "::error::Image $repo:$tag not found in GitHub Container Registry"
            exit 1
          fi
          echo "ref=$repo@$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Image to deploy"
            echo "- tag: \`$tag\`"
            echo "- digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: Deploy to staging
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      # Each environment has its own RENDER_DEPLOY_HOOK_URL secret (one Render service each).
      # Skipped until the secret is set (forks, before the Render setup).
      - name: Trigger the Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ needs.image.outputs.ref }}
          TARGET: staging
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret not set in the $TARGET environment: Render was not redeployed"
            exit 0
          fi
          # imgURL (URL-encoded): Render deploys this image instead of the tag in the service settings
          img=$(jq -rR @uri <<< "$IMAGE_REF")
          case "$DEPLOY_HOOK" in *\?*) sep='&' ;; *) sep='?' ;; esac
          curl -fsS -X POST -d '' "${DEPLOY_HOOK}${sep}imgURL=${img}" -w '\nHTTP %{http_code}\n'
          echo "### Deploy to $TARGET started: \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy to production
    needs: [image, staging]
    runs-on: ubuntu-latest
    # Protected environment: the job waits for the approval of a required reviewer
    environment: production
    concurrency:
      group: deploy-production
      # A newer image replaces one still waiting for approval
      cancel-in-progress: true
    steps:
      - name: Trigger the Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ needs.image.outputs.ref }}
          TARGET: production
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret not set in the $TARGET environment: Render was not redeployed"
            exit 0
          fi
          # imgURL (URL-encoded): Render deploys this image instead of the tag in the service settings
          img=$(jq -rR @uri <<< "$IMAGE_REF")
          case "$DEPLOY_HOOK" in *\?*) sep='&' ;; *) sep='?' ;; esac
          curl -fsS -X POST -d '' "${DEPLOY_HOOK}${sep}imgURL=${img}" -w '\nHTTP %{http_code}\n'
          echo "### Deploy to $TARGET started: \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
