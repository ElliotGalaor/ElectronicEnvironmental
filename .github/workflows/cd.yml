name: CD

# Builds the Docker image on every pull request (check) and publishes it to
# GitHub Container Registry on every merge to main and every v* tag.
# A merge to main then redeploys the Render service (docs/DEPLOY.md).
# A v* tag also creates a GitHub release with the release notes.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  tests:
    name: Tests before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  image:
    name: Docker image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build (loaded locally for the test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: electronic-environmental:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test
        run: |
          docker run -d --name app -p 8000:8000 electronic-environmental:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/stats > stats.json; then break; fi
            sleep 1
          done
          cat stats.json
          python3 -c "import json; d = json.load(open('stats.json')); assert d['total'] > 100, d; print('components in database:', d['total'])"
          curl -fsS http://127.0.0.1:8000/ | grep -q "RoHS / REACH Checker"
          docker logs app

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    name: Deploy to Render
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    steps:
      # Render does not watch the registry: its deploy hook makes it pull the new :latest image.
      # Skipped until the RENDER_DEPLOY_HOOK_URL secret is set (forks, before the Render setup).
      - name: Trigger the Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret not set: Render was not redeployed"
            exit 0
          fi
          curl -fsS -X POST -d '' "$DEPLOY_HOOK" -w '\nHTTP %{http_code}\n'

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="${IMAGE,,}:${GITHUB_REF_NAME#v}"
          fence='```'
          printf '## Docker image\n\n%sbash\ndocker run -p 8000:8000 -v rohs-data:/data %s\n%s\n' "$fence" "$image" "$fence" > notes.md
          # The generated notes (PRs merged since the previous version) are appended after this text
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
