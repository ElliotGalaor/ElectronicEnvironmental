[project]
name = "electronic-environmental"
version = "2.0.0"
description = "RoHS 2 / RoHS 3 / REACH compliance analysis and export control (ECCN) of an electronic bill of materials"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, import sorting
select = ["E", "F", "W", "B", "I"]
ignore = [
    "E501",  # line length: handled case by case
    "B008",  # Depends(...) as a default argument: standard FastAPI pattern
    "E741",  # "l" for a BOM line: readable in this context
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
